name: Bug report
description: Something in Caltrop does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Found a security vulnerability?** Please do not open an issue. Report it privately from the
        repository's **Security** tab (**Report a vulnerability**), as described in SECURITY.md.

  - type: input
    id: version
    attributes:
      label: Caltrop version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: .NET version and operating system
      placeholder: ".NET 10.0.1 on Windows 11"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the full exception message and ErrorCode if there was one.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Code to reproduce
      description: The smallest code that shows the problem. Never paste real keys or passwords.
      render: csharp

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
