name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Caltrop.slnx

      - name: Build
        run: dotnet build Caltrop.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test --project tests/Caltrop.Tests/Caltrop.Tests.csproj --configuration Release --no-build --minimum-expected-tests 150

      - name: Run the sample
        run: dotnet run --project samples/Caltrop.Samples/Caltrop.Samples.csproj --configuration Release --no-build

      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack src/Caltrop/Caltrop.csproj --configuration Release --no-build --output artifacts

      - name: Upload package
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/
